[meta]
version = 1

[hooks.pre-commit.jobs.ultracite]
run = 'pnpm dlx ultracite fix'
glob = ['**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.json', '**/*.jsonc', '**/*.css']
stage_fixed = true

# Check-only: markdownlint-cli2 always lints its configured globs, so an
# autofix here would also rewrite files the commit never staged.
# Run `pnpm run lint:md:fix` to fix.
[hooks.pre-commit.jobs.markdownlint]
run = 'pnpm run lint:md'
glob = ['**/*.md']

[hooks.pre-commit.jobs.yamllint]
run = 'pnpm run lint:yaml'
glob = ['**/*.yml', '**/*.yaml']

[hooks.pre-commit.jobs.actionlint]
run = 'pnpm run lint:actions'
glob = ['.github/workflows/*.{yml,yaml}']

[hooks.pre-commit.jobs.cspell]
run = 'pnpm exec cspell --config .config/cspell.json --no-progress --no-must-find-files {staged_files}'

[hooks.pre-commit.jobs.betterleaks]
run = 'mise exec -- betterleaks git --pre-commit --staged'

# betterhook 0.1 does not forward git's hook args, so no {1}; bare --edit
# reads the message file git just wrote (worktree-aware).
[hooks.commit-msg.jobs.commitlint]
run = 'pnpm exec commitlint --config .config/commitlint.config.ts --edit'
