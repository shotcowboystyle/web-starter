name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template:
    name: Template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, marketing]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    env:
      SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v5

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ultracite)
        run: pnpm run check

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Spell check
        run: pnpm run lint:spell

      - name: Unit tests (Vitest)
        run: pnpm run test:unit

      - name: Type check (Astro & TS)
        run: pnpm exec astro check

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests (Playwright)
        run: pnpm run test:e2e --project=chromium

  secrets:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Scan repository
        run: mise exec -- betterleaks dir .

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md templates/minimal/README.md templates/marketing/README.md
          fail: true
