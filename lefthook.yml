pre-commit:
  jobs:
    - name: markdownlint
      run: pnpm dlx markdownlint-cli2 --config .config/markdownlint.jsonc "*.md" "create/**/*.md"
      glob: "**/*.md"

    - name: yamllint
      run: mise exec -- yamllint -c .config/yamllint.yml .
      glob:
        - "**/*.yml"
        - "**/*.yaml"

    - name: actionlint
      run: mise exec -- actionlint .github/workflows/*.yml
      glob: ".github/workflows/*.{yml,yaml}"

    - name: cspell
      run: pnpm dlx cspell --config .config/cspell.json --no-progress --no-must-find-files {staged_files}

    - name: betterleaks
      run: mise exec -- betterleaks git --pre-commit --staged

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm dlx commitlint --config .config/commitlint.config.ts --edit {1}
